<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>信濃クエスト 〜地元企業と労働法を攻略せよ〜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --dq-bg: #000000;
      --dq-win: #0b1120;
      --dq-border: #ffffff;
      --dq-gold: #facc15;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--dq-bg);
      background-image:
        radial-gradient(circle at 20% 15%, rgba(30, 58, 138, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(88, 28, 135, 0.22) 0%, transparent 45%);
      color: #f8fafc;
      font-family: 'DotGothic16', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* クラシックRPG二重白枠ウィンドウ */
    .rpg-window {
      background: rgba(8, 13, 26, 0.96);
      border: 3px solid #ffffff;
      border-radius: 10px;
      box-shadow:
        inset 0 0 0 3px #000000,
        inset 0 0 0 5px #cbd5e1,
        0 8px 24px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .rpg-window-gold {
      background: rgba(8, 13, 26, 0.98);
      border: 3px solid #facc15;
      border-radius: 10px;
      box-shadow:
        inset 0 0 0 3px #000000,
        inset 0 0 0 5px #ca8a04,
        0 0 24px rgba(250, 204, 21, 0.35);
      position: relative;
    }

    /* RPGコマンドボタン（スマホで押しやすいサイズ） */
    .rpg-btn {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      color: #ffffff;
      padding: 13px 16px;
      font-family: 'DotGothic16', 'Noto Sans JP', sans-serif;
      font-size: 1rem;
      line-height: 1.45;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
    }

    .rpg-btn:hover:not(:disabled),
    .rpg-btn:active:not(:disabled) {
      border-color: #facc15;
      color: #fef08a;
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      transform: translateY(-1px);
    }

    .rpg-btn:disabled {
      opacity: 0.32;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .rpg-btn-primary {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      border: 3px solid #fef08a;
      color: #090d16;
      font-weight: 900;
      text-align: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.45);
    }

    .rpg-btn-primary:hover:not(:disabled),
    .rpg-btn-primary:active:not(:disabled) {
      background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 100%);
      color: #000000;
      transform: scale(1.02);
    }

    /* 企業HPリンクボタン */
    .hp-link-btn {
      background: linear-gradient(180deg, #0369a1 0%, #0c4a6e 100%);
      border: 2px solid #38bdf8;
      border-radius: 8px;
      color: #ffffff;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 0 12px;
      min-width: 48px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .hp-link-btn:hover,
    .hp-link-btn:active {
      background: #0284c7;
      border-color: #bae6fd;
      color: #ffffff;
    }

    /* 魔物ダメージアニメーション */
    @keyframes monsterShake {
      0%, 100% { transform: translate(0, 0) scale(1); filter: brightness(1); }
      18% { transform: translate(-14px, -6px) scale(0.96); filter: brightness(2.4) sepia(1) hue-rotate(-50deg) saturate(4); }
      36% { transform: translate(14px, 5px) scale(1.04); filter: brightness(2); }
      54% { transform: translate(-10px, 4px) scale(0.98); filter: brightness(2.4) sepia(1) hue-rotate(-50deg) saturate(4); }
      72% { transform: translate(10px, -4px) scale(1.02); }
    }

    .monster-damage {
      animation: monsterShake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }

    /* 斬撃＆切断エフェクト */
    .slash-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slash-line {
      position: absolute;
      top: 50%;
      left: -30%;
      width: 160%;
      height: 8px;
      background: linear-gradient(90deg, transparent, #ffffff, #38bdf8, #ffffff, transparent);
      box-shadow: 0 0 22px #38bdf8, 0 0 40px #ffffff;
      transform: rotate(-28deg) scaleX(0);
      opacity: 0;
      pointer-events: none;
      z-index: 30;
    }

    @keyframes slashStrike {
      0% { transform: rotate(-28deg) scaleX(0); opacity: 1; }
      45% { transform: rotate(-28deg) scaleX(1); opacity: 1; }
      100% { transform: rotate(-28deg) scaleX(1.15); opacity: 0; }
    }

    .slash-active .slash-line {
      animation: slashStrike 0.5s ease-out forwards;
    }

    @keyframes monsterSplitDefeat {
      0% { transform: scale(1); filter: brightness(1); opacity: 1; }
      25% { transform: scale(1.08); filter: brightness(3.5) contrast(2); opacity: 1; }
      55% { transform: skewX(26deg) translateX(22px) scaleY(0.85); filter: brightness(1.8) hue-rotate(85deg) blur(2px); opacity: 0.7; }
      100% { transform: skewX(-32deg) translateY(36px) scale(0.2); filter: blur(8px); opacity: 0; }
    }

    .monster-sliced {
      animation: monsterSplitDefeat 0.9s ease-in-out forwards;
    }

    /* 大魔王フェードイン演出 */
    @keyframes maouAppear {
      0% { opacity: 0; transform: scale(0.65) translateY(24px); filter: brightness(0) drop-shadow(0 0 0px #a855f7); }
      45% { opacity: 0.65; filter: brightness(0.45) drop-shadow(0 0 36px #9333ea); }
      78% { opacity: 0.92; transform: scale(1.05) translateY(-4px); filter: brightness(1.5) drop-shadow(0 0 50px #ef4444); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1) drop-shadow(0 0 22px #a855f7); }
    }

    .maou-fadein {
      animation: maouAppear 2.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* プレイヤー被ダメージ時の画面揺れ */
    @keyframes screenDamage {
      0%, 100% { transform: translate(0, 0); background-color: var(--dq-bg); }
      20% { transform: translate(-10px, 6px); background-color: rgba(185, 28, 28, 0.45); }
      45% { transform: translate(10px, -6px); background-color: rgba(185, 28, 28, 0.25); }
      70% { transform: translate(-6px, -4px); }
    }

    .player-damaged {
      animation: screenDamage 0.4s ease-in-out;
    }

    /* 商人ステージ：契約書（巻物デザイン） */
    .contract-scroll {
      background: #fef3c7;
      background-image: radial-gradient(#fde68a 1px, transparent 1px);
      background-size: 14px 14px;
      color: #1c1917;
      border: 5px double #78350f;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      font-family: 'Noto Sans JP', serif;
    }

    .contract-item {
      position: relative;
      cursor: pointer;
      padding: 12px 14px;
      border-radius: 8px;
      border: 2px dashed #a8a29e;
      transition: all 0.12s ease;
      background: rgba(255, 255, 255, 0.72);
    }

    .contract-item.circled {
      background: rgba(254, 226, 226, 0.9);
      border: 2px solid #dc2626;
    }

    .red-circle-mark {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-3deg);
      width: 94%;
      height: 86%;
      border: 4px solid #dc2626;
      border-radius: 50% 45% 52% 48%;
      box-shadow: 0 0 8px rgba(220, 38, 38, 0.4);
      pointer-events: none;
    }

    .contract-item.circled .red-circle-mark {
      display: block;
    }

    /* エンディング紙吹雪＆キラキラ */
    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 10px;
      z-index: 40;
      pointer-events: none;
      animation: confettiFall linear infinite;
    }

    @keyframes sparklePulse {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .sparkle {
      animation: sparklePulse 1.8s ease-in-out infinite;
    }
  </style>
</head>

    /* 非ブロッキング画像プリロード（失敗しても進行を妨げない） */
    function preloadImagesSafely() {
      const urls = [
        ASSETS.topImg, ASSETS.title2Img, ASSETS.kamiImg,
        ASSETS.zombieImg, ASSETS.goblinImg, ASSETS.minoImg,
        ASSETS.merchantImg, ASSETS.dragonImg, ASSETS.maouImg,
        ASSETS.overImg, ASSETS.endingImg
      ];
      urls.forEach(url => {
        try {
          const img = new Image();
          img.src = url;
        } catch (e) {
          // 無視
        }
      });
    }

    /* ==============================================================
       2. iOS Safari / Chrome 完全対応 サウンドマネージャー
       ============================================================== */
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.currentBgm = null;
        this.currentKey = null;
        this.bgms = {};
        this.initBgmObjects();
      }

      initBgmObjects() {
        const tracks = {
          opening: ASSETS.bgmOpening,
          maou: ASSETS.bgmMaou,
          over: ASSETS.bgmOver,
          ending: ASSETS.bgmEnding
        };
        Object.keys(tracks).forEach(key => {
          try {
            const audio = new Audio();
            audio.src = tracks[key];
            audio.loop = true;
            audio.preload = "metadata";
            audio.volume = 0.35;
            this.bgms[key] = audio;
          } catch (e) {
            // 無視
          }
        });
      }

      unlockAudio() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!this.ctx && AudioCtx) {
            this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === "suspended") {
            this.ctx.resume().catch(() => {});
          }
        } catch (e) {
          // iOS制限下でもエラー停止させない
        }
      }

      playBgm(key) {
        try {
          if (this.currentKey === key && this.currentBgm && !this.currentBgm.paused) {
            return;
          }
          this.stopBgm();
          const target = this.bgms[key];
          if (!target) return;
          this.currentBgm = target;
          this.currentKey = key;
          target.currentTime = 0;
          target.muted = this.muted;
          if (!this.muted) {
            const p = target.play();
            if (p && typeof p.catch === "function") {
              p.catch(() => {});
            }
          }
        } catch (e) {
          // 無視
        }
      }

      stopBgm() {
        try {
          if (this.currentBgm) {
            this.currentBgm.pause();
            this.currentBgm.currentTime = 0;
          }
          this.currentBgm = null;
          this.currentKey = null;

        this.muted = !this.muted;
        try {
          if (this.currentBgm) {
            this.currentBgm.muted = this.muted;
            if (!this.muted && this.currentBgm.paused) {
              const p = this.currentBgm.play();
              if (p && typeof p.catch === "function") {
                p.catch(() => {});
              }
            }
          }
        } catch (e) {
          // 無視
        }
        return this.muted;
      }

      playTone(freq, duration, type = "square", volume = 0.04) {
        if (this.muted) return;
        try {
          this.unlockAudio();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          // 無視
        }
      }

        this.playTone(760, 0.03, "square", 0.02);

        if (this.muted) return;

    function clearAllTimers() {
      activeTimers.forEach(id => {
        clearTimeout(id);
        clearInterval(id);
      });
      activeTimers = [];
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /* ==============================================================
       5. 共通UI演出（タイプライター・バナー・モーダル・HUD）
       ============================================================== */
    function typeText(elementId, text, speed = 42, onComplete = null) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.textContent = "";
      let idx = 0;
      const timerId = setInterval(() => {
        if (!document.getElementById(elementId)) {
          clearInterval(timerId);
          return;
        }
        if (idx < text.length) {
          el.textContent += text.charAt(idx);
          // iOS負荷対策：3文字に1回だけピピ音を鳴らす
          if (idx % 3 === 0 && text.charAt(idx) !== " " && text.charAt(idx) !== "　") {
            sound.playPip();
          }
          idx++;
        } else {
          clearInterval(timerId);
          if (onComplete) onComplete();
        }
      }, speed);
      activeTimers.push(timerId);
    }

    function showBanner(text, colorClass = "text-yellow-300 border-yellow-300") {
      const banner = document.getElementById("effect-banner");
      const inner = document.getElementById("effect-banner-inner");
      const textEl = document.getElementById("effect-banner-text");
      if (!banner || !inner || !textEl) return;

      textEl.textContent = text;
      inner.className = `px-4 py-2.5 rounded-xl border-2 bg-slate-950/95 font-bold text-sm sm:text-base shadow-2xl flex items-center justify-center gap-2 text-center ${colorClass}`;
      banner.classList.remove("opacity-0", "-translate-y-3");
      banner.classList.add("opacity-100", "translate-y-0");

      const t = setTimeout(() => {
        banner.classList.remove("opacity-100", "translate-y-0");
        banner.classList.add("opacity-0", "-translate-y-3");
      }, 2200);
      activeTimers.push(t);
    }

    function showModal(title, bodyText, btnLabel, onNext) {
      const overlay = document.getElementById("modal-overlay");
      const titleEl = document.getElementById("modal-title");
      const bodyEl = document.getElementById("modal-body");
      const btn = document.getElementById("modal-next-btn");

      titleEl.innerHTML = `<i class="fa-solid fa-scroll"></i> ${title}`;
      bodyEl.textContent = bodyText;
      btn.innerHTML = `${btnLabel} <i class="fa-solid fa-caret-right ml-1"></i>`;

      overlay.classList.remove("hidden");
      overlay.classList.add("flex");

      btn.onclick = () => {
        sound.playClick();
        overlay.classList.add("hidden");
        overlay.classList.remove("flex");
        if (onNext) onNext();
      };
    }

    function showHud() {
      document.getElementById("hud-bar").classList.remove("hidden");
      updateHud();
    }

    function hideHud() {
      document.getElementById("hud-bar").classList.add("hidden");
    }

    function updateHud() {
      const job = JOBS[state.jobKey] || JOBS.hero;
      document.getElementById("hud-job-icon").textContent = job.icon;
      document.getElementById("hud-job").textContent = job.name;
      document.getElementById("hud-name").textContent = state.playerName;
      document.getElementById("hud-score").textContent = state.score;
      document.getElementById("hud-hp").textContent = state.hp;
      document.getElementById("hud-maxhp").textContent = state.maxHp;

      const pct = Math.max(0, Math.min(100, Math.round((state.hp / state.maxHp) * 100)));
      const bar = document.getElementById("hud-hp-bar");
      bar.style.width = `${pct}%`;
      if (pct <= 25) {
        bar.className = "bg-gradient-to-r from-red-600 to-rose-500 h-full transition-all duration-300";
      } else if (pct <= 50) {
        bar.className = "bg-gradient-to-r from-amber-500 to-yellow-400 h-full transition-all duration-300";
      } else {
        bar.className = "bg-gradient-to-r from-emerald-500 to-green-400 h-full transition-all duration-300";
      }

      const reviveBadge = document.getElementById("hud-revive-badge");
      reviveBadge.textContent = state.items.revive > 0 ? `📖復活の書×${state.items.revive}` : "";

      const itemsContainer = document.getElementById("hud-items");
      itemsContainer.innerHTML = "";

      const usableItems = [
        { key: "herb", label: "🌿薬草", color: "border-emerald-400 text-emerald-200 bg-emerald-950/80" },
        { key: "wand", label: "🪄魔法の杖", color: "border-sky-400 text-sky-200 bg-sky-950/80" },
        { key: "apple", label: "🍎奇跡のリンゴ", color: "border-rose-400 text-rose-200 bg-rose-950/80" }
      ];

      let anyShown = false;
      usableItems.forEach(item => {
        if (state.items[item.key] > 0) {
          anyShown = true;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `px-2 py-1 rounded border text-xs font-bold transition active:scale-95 ${item.color}`;
          btn.textContent = state.items[item.key] > 1 ? `${item.label}×${state.items[item.key]}` : item.label;
          btn.onclick = () => useItem(item.key);
          itemsContainer.appendChild(btn);
        }
      });

      if (!anyShown) {
        const span = document.createElement("span");
        span.className = "text-xs text-slate-500";
        span.textContent = "なし";
        itemsContainer.appendChild(span);
      }
    }

    /* ==============================================================
       6. アイテム使用処理
       ============================================================== */
    function useItem(key) {
      if (state.items[key] <= 0) return;

      if (key === "herb") {
        const healAmt = state.jobKey === "priest" ? 40 : 20;
        state.items.herb--;
        state.hp = Math.min(state.maxHp, state.hp + healAmt);
        sound.playHeal();
        const extra = state.jobKey === "priest" ? "（僧侶効果2倍！）" : "";
        showBanner(`🌿 薬草を使用！HPが ${healAmt} 回復した！${extra}`, "text-emerald-300 border-emerald-400");
        updateHud();
        return;
      }

      if (key === "wand") {
        if (!state.inBattle) {
          showBanner("🪄 魔法の杖は魔物とのバトル中に使えます！", "text-sky-300 border-sky-400");
          return;
        }
        if (state.wandUsedOnCurrentQ) {
          showBanner("🪄 この問題ではすでに選択肢を減らしています！", "text-sky-300 border-sky-400");
          return;
        }
        state.items.wand--;
        state.wandUsedOnCurrentQ = true;
        applyWandReduction();
        sound.playHeal();
        showBanner("🪄 魔法の杖を使用！選択肢が3つに絞られた！", "text-sky-300 border-sky-400");
        updateHud();
        return;
      }

      if (key === "apple") {
        const healAmt = state.jobKey === "priest" ? 40 : 20;
        state.items.apple--;
        state.hp = Math.min(state.maxHp, state.hp + healAmt);
        state.items.revive++;
        if (state.inBattle && !state.wandUsedOnCurrentQ) {
          state.wandUsedOnCurrentQ = true;
          applyWandReduction();
        }
        sound.playHeal();
        showBanner(`🍎 奇跡のリンゴ！HP+${healAmt}＆選択肢削減＆復活の書+1！`, "text-rose-300 border-rose-400");
        updateHud();
      }
    }

    function applyWandReduction() {
      const monster = MONSTERS[state.monsterIndex];
      if (!monster) return;
      const qObj = monster.questions[state.questionIndex];
      if (!qObj) return;

      const btns = Array.from(document.querySelectorAll(".battle-option-btn"));
      const wrongActiveBtns = btns.filter(b => Number(b.dataset.origIdx) !== qObj.answer && !b.disabled);

      // 残り選択肢が3つ（正解1＋不正解2）になるまで無効化
      const targetDisableCount = Math.max(0, wrongActiveBtns.length - 2);
      const toDisable = shuffleArray(wrongActiveBtns).slice(0, targetDisableCount);
      toDisable.forEach(btn => {
        btn.disabled = true;
      });
    }

    /* ==============================================================

    function renderMonsterBattle() {
      clearAllTimers();

      }

      const qObj = monster.questions[state.questionIndex];

      state.lastCheckpoint = { type: "battle", monsterIndex: state.monsterIndex, questionIndex: state.questionIndex };

      // 魔物5（大魔王）の時は専用BGMを流す
      if (monster.isMaou) {
        sound.playBgm("maou");
      }

      updateHud();

      const isFirstQOfMonster = state.questionIndex === 0;
      const maouAnimClass = monster.isMaou && isFirstQOfMonster ? "maou-fadein" : "";

      // 選択肢をシャッフル
      const shuffledOptions = shuffleArray(qObj.options.map((text, idx) => ({ text, origIdx: idx })));

      // 魔法使い特性：5択のうち最初からハズレを1つ消去
      let mageEliminatedIdx = -1;
      if (state.jobKey === "mage" && shuffledOptions.length >= 5) {
        const wrongs = shuffledOptions.filter(o => o.origIdx !== qObj.answer);
        if (wrongs.length > 0) {
          mageEliminatedIdx = wrongs[Math.floor(Math.random() * wrongs.length)].origIdx;
        }
      }

      // 参考企業HPボタン（ヤッホーブルーイング、パスカルなど問題文の企業用）
      let refHpHtml = "";
      if (qObj.refCompany && COMPANY_LINKS[qObj.refCompany]) {
        refHpHtml = `
          <div class="mt-2.5 flex justify-end">
            <a href="${COMPANY_LINKS[qObj.refCompany]}" target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-sky-800 border border-sky-400 text-white text-xs font-bold hover:bg-sky-700">

            </a>
          </div>
        `;
      }

      const main = document.getElementById("main-screen");
      main.innerHTML = `
        <div class="flex flex-col">
          <!-- 魔物表示エリア -->
          <div class="flex flex-col items-center justify-center py-2 mb-3 bg-gradient-to-b from-slate-900/90 to-black rounded-lg border border-slate-700 min-h-[190px] relative">
            <div class="absolute top-2 left-2.5 text-xs px-2 py-0.5 rounded bg-slate-800/90 border border-slate-600 text-amber-300 font-bold">
              STAGE ${state.monsterIndex + 1} / ${MONSTERS.length}

            <div class="absolute top-2 right-2.5 text-xs text-slate-400 font-bold">
              ${monster.questions.length > 1 ? `第 ${state.questionIndex + 1} / ${monster.questions.length} 問` : "一撃必殺！"}

              <img id="monster-img" src="${monster.img}" alt="${monster.name}"

                   onerror="this.src='https://placehold.co/220x160/1e293b/f43f5e?text=${encodeURIComponent(monster.name)}'">
            </div>
            <div class="text-sm sm:text-base font-bold text-rose-300 mt-2">
              ${isFirstQOfMonster ? `⚠️ ${monster.name}が現れた！` : `⚔️ ${monster.name}と戦闘中！`}
            </div>
          </div>

          <!-- 問題文ウィンドウ -->
          <div class="rpg-window p-3.5 sm:p-4 mb-3">
            <p class="text-sm sm:text-base leading-relaxed text-white font-bold">${qObj.q}</p>
            ${refHpHtml}
          </div>

          ${mageEliminatedIdx !== -1 ? `<div class="text-xs text-purple-300 mb-2 px-1">🔮 魔法使いの特性【データ解析】発動！ハズレを1つ消去した！</div>` : ""}

        </div>
      `;

      const optionsBox = document.getElementById("battle-options");
      shuffledOptions.forEach(opt => {
        const row = document.createElement("div");
        row.className = "flex items-stretch gap-1.5";

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "rpg-btn flex-1 battle-option-btn";
        btn.dataset.origIdx = opt.origIdx;
        btn.innerHTML = `<span class="text-amber-300 shrink-0">▶</span><span>${opt.text}</span>`;

        if (opt.origIdx === mageEliminatedIdx) {
          btn.disabled = true;
        }

        btn.onclick = () => handleBattleAnswer(opt.origIdx, btn);
        row.appendChild(btn);

        // 選択肢が企業名に一致する場合は横に「HP」リンクボタンを表示
        if (COMPANY_LINKS[opt.text]) {
          const link = document.createElement("a");
          link.href = COMPANY_LINKS[opt.text];
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.className = "hp-link-btn";
          link.textContent = "HP";
          link.title = `${opt.text}の公式サイトを開く`;
          row.appendChild(link);
        }

        optionsBox.appendChild(row);
      });
    }

    function handleBattleAnswer(selectedOrigIdx, clickedBtn) {
      const monster = MONSTERS[state.monsterIndex];
      const qObj = monster.questions[state.questionIndex];

      if (selectedOrigIdx === qObj.answer) {
        // 正解：ボタン全ロック
        document.querySelectorAll(".battle-option-btn").forEach(b => (b.disabled = true));
        state.inBattle = false;

        // スコア＆ジョブ特性計算
        let gainedScore = 100;
        let isCritical = false;

        if (state.jobKey === "warrior" && qObj.category === "warrior") {
          gainedScore = 150;
          isCritical = true;
        } else if (state.jobKey === "priest" && qObj.category === "priest") {
          gainedScore = 130;
          isCritical = true;
        } else if (state.jobKey === "mage" && qObj.category === "mage") {
          gainedScore = 130;
          isCritical = true;
        } else if (state.jobKey === "hero") {
          gainedScore = 120;
        }

        state.score += gainedScore;
        updateHud();

        const isLastQOfMonster = state.questionIndex === monster.questions.length - 1;
        const imgEl = document.getElementById("monster-img");
        const slashBox = document.getElementById("monster-slash-box");

        if (isCritical) {
          showBanner(`⚡ 会心の一撃！ +${gainedScore} SCORE！`, "text-yellow-300 border-yellow-300");
        } else {
          showBanner(`✨ 正解！ +${gainedScore} SCORE！`, "text-emerald-300 border-emerald-400");
        }

        if (isLastQOfMonster) {
          sound.playSlash();
          if (slashBox) slashBox.classList.add("slash-active");
          if (imgEl) imgEl.classList.add("monster-sliced");
        } else {
          sound.playCorrect();
          if (imgEl) imgEl.classList.add("monster-damage");
        }

        const proceedNext = () => {
          if (!isLastQOfMonster) {
            state.questionIndex++;
            renderMonsterBattle();
          } else {
            // 僧侶特性：ステージクリアごとにHP+5自動回復
            if (state.jobKey === "priest" && state.hp < state.maxHp) {
              state.hp = Math.min(state.maxHp, state.hp + 5);
              updateHud();
              showBanner("✨ 僧侶【おもてなしの心】HPが5自動回復した！", "text-emerald-300 border-emerald-400");
            }

            // 魔物3（index 2）を倒した直後に商人ステージへ
            if (state.monsterIndex === 2 && !state.merchantDone) {
              renderMerchantIntro();
            } else {
              state.monsterIndex++;
              state.questionIndex = 0;
              if (state.monsterIndex >= MONSTERS.length) {
                renderEnding();
              } else {
                renderMonsterBattle();
              }
            }
          }
        };

        const delay = isLastQOfMonster ? 950 : 700;
        const t = setTimeout(() => {
          if (qObj.explanation) {
            showModal(
              qObj.explanationTitle || "解説",
              qObj.explanation,
              isLastQOfMonster && state.monsterIndex === MONSTERS.length - 1 ? "エンディングへ" : "次へ進む",
              proceedNext
            );
          } else {
            proceedNext();
          }
        }, delay);
        activeTimers.push(t);
      } else {
        // 不正解：ブブ！＆HP-10
        sound.playBuzzer();
        clickedBtn.disabled = true;
        state.hp = Math.max(0, state.hp - 10);
        updateHud();

        const body = document.getElementById("game-body");
        body.classList.remove("player-damaged");
        void body.offsetWidth;
        body.classList.add("player-damaged");

        showBanner("💥 ブブ！不正解… HPが10減った！", "text-rose-300 border-rose-500");

        if (state.hp <= 0) {
          const t = setTimeout(() => {
            renderGameOver();
          }, 550);
          activeTimers.push(t);
        }
      }
    }

      clearAllTimers();
      const main = document.getElementById("main-screen");
      main.innerHTML = `
        <div class="flex flex-col items-center text-center">
          <div class="text-xs text-amber-300 font-bold mb-2">【商人ゲーム１】怪しい契約書を見破れ！</div>
          <div class="rpg-window w-full p-4 mb-5 text-left text-sm sm:text-base leading-relaxed">
            商人が差し出すアルバイト契約書の中に、<span class="text-rose-400 font-bold">法律違反の条件</span>が紛れ込んでいます！<br><br>
            ・制限時間は <span class="text-amber-300 font-bold">30秒</span><br>
            ・違反だと思う項目をすべてタップして<span class="text-rose-400 font-bold">赤丸</span>をつけ、「OK」ボタンを押してください。<br>
            ・間違った組み合わせでOKを押すと赤丸がリセットされます！
          </div>
          <button id="contract-start-btn" type="button" class="rpg-btn rpg-btn-primary w-full py-4 text-lg">
            スタート！（カウントダウン開始）
          </button>
        </div>
      `;

      document.getElementById("contract-start-btn").onclick = () => {
        sound.playClick();
        let count = 3;
        main.innerHTML = `
          <div class="flex flex-col items-center justify-center min-h-[280px]">
            <div class="text-sm text-amber-300 mb-3">商人が契約書を広げている…</div>
            <div id="countdown-num" class="text-7xl font-black text-yellow-300">${count}</div>
          </div>
        `;
        const cdTimer = setInterval(() => {
          count--;
          if (count > 0) {
            sound.playPip();
            const el = document.getElementById("countdown-num");
            if (el) el.textContent = count;
          } else {
            clearInterval(cdTimer);
            sound.playCorrect();
            renderMerchantGame1Play();
          }
        }, 700);
        activeTimers.push(cdTimer);
      };
    }

    function renderMerchantGame1Play() {
      clearAllTimers();
      let timeLeft = 30;
      const circledIds = new Set();

      const main = document.getElementById("main-screen");
      main.innerHTML = `
        <div class="flex flex-col">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs sm:text-sm font-bold text-amber-300">📜 商人のアルバイト契約書</span>
            <span id="contract-timer" class="px-3 py-1 rounded-full bg-rose-900 border border-rose-400 text-white font-black text-sm">
              残り 30 秒
            </span>
          </div>
          <p class="text-xs text-slate-300 mb-2">商人「さあ、サインしな！最高条件だぜ！」（法律違反をタップして赤丸をつけろ！）</p>

          <div class="contract-scroll p-3.5 sm:p-4 mb-3">
            <div class="text-center font-black text-base sm:text-lg border-b-2 border-amber-900/40 pb-2 mb-3 text-amber-950">
              アルバイト雇用契約書
            </div>
            <div id="contract-items-list" class="flex flex-col gap-2"></div>
          </div>

          <div id="contract-feedback" class="text-center text-xs font-bold text-rose-400 min-h-[20px] mb-2"></div>

          <button id="contract-ok-btn" type="button" class="rpg-btn rpg-btn-primary w-full py-3.5 text-base">
            これでOK！（違反を指摘する）
          </button>
        </div>
      `;

      const listEl = document.getElementById("contract-items-list");
      const feedbackEl = document.getElementById("contract-feedback");
      const timerEl = document.getElementById("contract-timer");

      const renderItems = () => {
        listEl.innerHTML = "";
        MERCHANT_CONTRACT_ITEMS.forEach(item => {
          const div = document.createElement("div");
          div.className = `contract-item ${circledIds.has(item.id) ? "circled" : ""}`;
          div.innerHTML = `
            <span class="font-bold text-sm sm:text-base">・${item.text}</span>
            <div class="red-circle-mark"></div>
          `;
          div.onclick = () => {
            sound.playClick();
            if (circledIds.has(item.id)) circledIds.delete(item.id);
            else circledIds.add(item.id);
            renderItems();
          };
          listEl.appendChild(div);
        });
      };

      renderItems();

      const contractExplain =
        "【正解の違反箇所：3つ】\n" +
        "① 時給1000円：最低賃金違反！長野県の最低賃金（1170円）を下回っています。\n" +
        "② 自腹清算：NG！わざと会社の物を壊した等の特別な場合を除き、計算ミス等を給料から天引き・自腹清算させるのは違法です。\n" +
        "③ 1日ごとに給与見直し：金額を上げるのはOKですが、成績を理由に一方的に条件を引き下げるのは非常に難しく、違法になりやすいです。";

      const timerId = setInterval(() => {
        timeLeft--;
        if (timerEl) timerEl.textContent = `残り ${timeLeft} 秒`;
        if (timeLeft <= 0) {
          clearInterval(timerId);
          sound.playBuzzer();
          showModal("時間切れ！契約書の解説", contractExplain, "ゲーム２へ進む", () => {
            renderMerchantDebate(0);
          });
        }
      }, 1000);
      activeTimers.push(timerId);

      document.getElementById("contract-ok-btn").onclick = () => {
        const expectedIds = MERCHANT_CONTRACT_ITEMS.filter(i => i.isViolation).map(i => i.id);
        const isAllCorrect =
          circledIds.size === expectedIds.length &&
          expectedIds.every(id => circledIds.has(id));

        if (isAllCorrect) {
          clearInterval(timerId);
          sound.playCorrect();
          state.merchantClearedCount++;
          state.score += 100;
          updateHud();
          showModal("見破った！契約書の解説", contractExplain, "ゲーム２へ進む", () => {
            renderMerchantDebate(0);
          });
        } else {
          sound.playBuzzer();
          circledIds.clear();
          renderItems();
          feedbackEl.textContent = "❌ 組み合わせが違います！赤丸がリセットされました。もう一度選び直してください！";
        }
      };
    }

    function renderMerchantDebate(debateIdx) {
      clearAllTimers();
      const dData = MERCHANT_DEBATES[debateIdx];
      const main = document.getElementById("main-screen");

      main.innerHTML = `
        <div class="flex flex-col">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-amber-300">⚖️ ゲーム２：商人の言い訳を論破しろ！（${debateIdx + 1}/2）</span>
            <span id="debate-timer" class="hidden px-3 py-1 rounded-full bg-rose-900 border border-rose-400 text-white font-black text-xs">
              残り 30 秒
            </span>
          </div>
          <div class="rpg-window p-4 mb-4">
            <div class="text-xs text-sky-300 font-bold mb-1">${dData.title}</div>
            <p class="text-sm sm:text-base leading-relaxed text-white whitespace-pre-line">${dData.story}</p>
          </div>
          <button id="show-debate-options-btn" type="button" class="rpg-btn rpg-btn-primary w-full py-3.5 text-base">
            選択肢を表示する（30秒タイマー開始）
          </button>
          <div id="debate-options" class="hidden flex flex-col gap-2.5 mt-2"></div>
        </div>
      `;

      document.getElementById("show-debate-options-btn").onclick = () => {
        sound.playClick();
        document.getElementById("show-debate-options-btn").classList.add("hidden");
        const timerEl = document.getElementById("debate-timer");
        const optBox = document.getElementById("debate-options");
        timerEl.classList.remove("hidden");
        optBox.classList.remove("hidden");

        let timeLeft = 30;
        const goNext = () => {
          if (debateIdx + 1 < MERCHANT_DEBATES.length) {
            renderMerchantDebate(debateIdx + 1);
          } else {
            finishMerchantStage();
          }
        };

        const timerId = setInterval(() => {
          timeLeft--;
          timerEl.textContent = `残り ${timeLeft} 秒`;
          if (timeLeft <= 0) {
            clearInterval(timerId);
            sound.playBuzzer();
            showModal("時間切れ！解説", dData.explanation, "次へ進む", goNext);
          }
        }, 1000);
        activeTimers.push(timerId);

        // 番号やアルファベットを付けずにランダム表示
        const shuffled = shuffleArray(dData.options.map((text, idx) => ({ text, origIdx: idx })));
        shuffled.forEach(opt => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "rpg-btn w-full";
          btn.innerHTML = `<span class="text-amber-300 shrink-0">▶</span><span>${opt.text}</span>`;
          btn.onclick = () => {
            clearInterval(timerId);
            if (opt.origIdx === dData.answer) {
              sound.playCorrect();
              state.merchantClearedCount++;
              state.score += 100;
              updateHud();
              showModal("見事論破！正解＆解説", dData.explanation, "次へ進む", goNext);
            } else {
              sound.playBuzzer();
              showModal("論破失敗… 正解と解説", dData.explanation, "次へ進む", goNext);
            }
          };
          optBox.appendChild(btn);
        });
      };
    }

    function finishMerchantStage() {
      clearAllTimers();
      state.merchantDone = true;
      const allCleared = state.merchantClearedCount === 3;
      let resultTitle = "";
      let resultBody = "";

      if (allCleared) {
        const heal = Math.max(10, Math.round(state.hp * 0.2));
        state.hp = Math.min(state.maxHp, state.hp + heal);
        sound.playHeal();
        resultTitle = "商人ステージ完全攻略！";
        resultBody = `バイト代でおもいっきり飲食をして、HPが回復した！（HP +${heal}）\n\nさあ、いよいよ後半戦・ドラゴンが待ち受けているぞ！`;
      } else {
        const dmg = Math.max(5, Math.round(state.hp * 0.3));
        state.hp = Math.max(0, state.hp - dmg);
        sound.playBuzzer();
        resultTitle = "商人ステージ終了…";
        resultBody = `ブラックバイトでメンタル削られた！（クリア数：${state.merchantClearedCount}/3、HP -${dmg}）\n\n気を取り直して後半戦へ進もう！`;
      }
      updateHud();

      showModal(resultTitle, resultBody, state.hp <= 0 ? "次へ" : "魔物④ドラゴンへ進む", () => {
        if (state.hp <= 0) {
          state.lastCheckpoint = { type: "battle", monsterIndex: 3, questionIndex: 0 };
          renderGameOver();
        } else {
          state.monsterIndex = 3;
          state.questionIndex = 0;
          renderMonsterBattle();
        }
      });
    }

    /* ==============================================================
       12. ゲームオーバー画面（復活の書 ＆ 復活の呪文「1126」）
       ============================================================== */
    function renderGameOver() {
      clearAllTimers();
      state.inBattle = false;
      hideHud();
      sound.playBgm("over");

      const job = JOBS[state.jobKey] || JOBS.hero;
      const hasRevive = state.items.revive > 0;

      const main = document.getElementById("main-screen");
      main.innerHTML = `
        <div class="flex flex-col items-center text-center">
          <div class="text-rose-400 font-black text-xl tracking-widest mb-3">GAME OVER</div>
          <div class="w-full rounded-lg overflow-hidden border-2 border-rose-500/80 mb-4 bg-black">
            <img src="${ASSETS.overImg}" alt="ゲームオーバー" class="w-full max-h-[240px] object-contain mx-auto"
                 onerror="this.src='https://placehold.co/560x240/1f0000/f43f5e?text=GAME+OVER'">
          </div>
          <div class="rpg-window w-full p-4 mb-4 text-left">
            <p class="text-sm sm:text-base leading-relaxed text-rose-100">
              ${job.name} ${state.playerName}よ、死んでしまうとはふがいない。このままでは信濃の平和は取り返せない。何としても再挑戦をしてほしい！
            </p>
          </div>

          <div class="w-full flex flex-col gap-3">
            ${hasRevive ? `
              <button id="use-revive-book-btn" type="button" class="rpg-btn rpg-btn-primary w-full py-3.5 text-base">
                📖 復活の書を使う（残り ${state.items.revive} 冊）
              </button>
            ` : ""}

            <!-- 復活の呪文入力エリア -->
            <div class="rpg-window p-3.5 text-left">
              <div class="text-xs sm:text-sm font-bold text-amber-300 mb-2">
                🔮 復活の呪文は講師に聞け！
              </div>
              <div class="flex gap-2">
                <input id="revive-spell-input" type="text" inputmode="numeric" maxlength="8" placeholder="呪文を入力"
                       class="flex-1 px-3 py-2.5 rounded-lg bg-slate-900 border-2 border-slate-500 text-white text-center font-bold focus:outline-none focus:border-amber-400">
                <button id="revive-spell-btn" type="button" class="rpg-btn px-5 py-2.5 justify-center font-bold text-amber-300 border-amber-400">
                  唱える
                </button>
              </div>
              <div id="spell-error" class="hidden text-xs text-rose-400 font-bold mt-1.5">呪文が違うようだ…講師に聞いてみよう！</div>
            </div>

            <button id="restart-from-top-btn" type="button" class="rpg-btn w-full justify-center py-3 text-base">
              <i class="fa-solid fa-rotate-left"></i> 最初から挑戦する
            </button>
          </div>
        </div>
      `;

      const reviveToCheckpoint = (msg) => {
        sound.stopBgm();
        sound.playHeal();
        state.hp = Math.max(30, Math.round(state.maxHp * 0.5));
        showHud();
        showBanner(msg, "text-amber-300 border-amber-400");

        if (state.lastCheckpoint && state.lastCheckpoint.type === "battle") {
          state.monsterIndex = state.lastCheckpoint.monsterIndex;
          state.questionIndex = state.lastCheckpoint.questionIndex;
          renderMonsterBattle();
        } else {
          renderMerchantIntro();
        }
      };

      const reviveBookBtn = document.getElementById("use-revive-book-btn");
      if (reviveBookBtn) {
        reviveBookBtn.onclick = () => {
          state.items.revive--;
          reviveToCheckpoint("📖 復活の書が光り輝いた！HPを回復して再挑戦！");
        };
      }

      const spellInput = document.getElementById("revive-spell-input");
      const spellErr = document.getElementById("spell-error");
      const trySpell = () => {
        const val = spellInput.value.trim();
        if (val === "1126") {
          reviveToCheckpoint("✨ 復活の呪文が発動！その問題から再スタート！");
        } else {
          sound.playBuzzer();
          spellErr.classList.remove("hidden");
        }
      };

      document.getElementById("revive-spell-btn").onclick = trySpell;
      spellInput.addEventListener("keydown", e => {
        if (e.key === "Enter") trySpell();
      });

      document.getElementById("restart-from-top-btn").onclick = () => {
        sound.playClick();
        resetAllState();
        renderTitle1();
      };
    }

    /* ==============================================================
       13. エンディング画面（紙吹雪・祝福メッセージ）
       ============================================================== */
    function renderEnding() {
      clearAllTimers();
      state.inBattle = false;
      hideHud();
      sound.playBgm("ending");
      spawnConfetti();

      const job = JOBS[state.jobKey] || JOBS.hero;
      const main = document.getElementById("main-screen");
      main.innerHTML = `
        <div class="flex flex-col items-center text-center">
          <div class="text-amber-300 text-lg sm:text-xl font-black tracking-widest mb-3 sparkle">
            ✨ QUEST CLEAR!! ✨
          </div>

          <div class="w-full rounded-lg overflow-hidden border-2 border-amber-300 shadow-[0_0_30px_rgba(250,204,21,0.45)] mb-4 bg-black">
            <img src="${ASSETS.endingImg}" alt="エンディング" class="w-full max-h-[280px] object-contain mx-auto"
                 onerror="this.src='https://placehold.co/560x280/0f172a/facc15?text=HAPPY+ENDING'">
          </div>

          <div class="rpg-window-gold w-full p-4 mb-4 text-left">
            <div class="text-xs text-amber-300 font-bold mb-1.5">【伝説の記録】</div>
            <p id="ending-message" class="text-sm sm:text-base leading-relaxed text-white min-h-[100px]"></p>
          </div>

          <div class="grid grid-cols-3 gap-2 w-full mb-5">
            <div class="rpg-window p-2.5">
              <div class="text-[10px] text-slate-400">ジョブ・名前</div>
              <div class="text-xs sm:text-sm font-bold text-amber-300 mt-0.5 truncate">${job.icon} ${job.name}<br>${state.playerName}</div>
            </div>
            <div class="rpg-window p-2.5">
              <div class="text-[10px] text-slate-400">残りHP</div>
              <div class="text-sm sm:text-base font-bold text-emerald-400 mt-1">${state.hp} / ${state.maxHp}</div>
            </div>
            <div class="rpg-window p-2.5">
              <div class="text-[10px] text-slate-400">最終スコア</div>
              <div class="text-sm sm:text-base font-black text-yellow-300 mt-1">${state.score}</div>
            </div>
          </div>

          <button id="back-to-top-btn" type="button" class="rpg-btn rpg-btn-primary w-full py-3.5 text-lg">
            <i class="fa-solid fa-house mr-1"></i> 最初に戻る
          </button>
        </div>
      `;

      const praiseText = `${job.name}・${state.playerName}よ！あなたの知恵と地元企業・労働法への深い理解によって大魔王は打ち倒され、信濃の森に再び平和が戻った！長野県には世界に誇る技術やサービスを持つ魅力的な企業がたくさんある。${state.playerName}のこれからのキャリアにも、輝かしい未来が広がっているぞ。ありがとう、信濃を救った英雄 ${state.playerName}よ！！`;
      typeText("ending-message", praiseText, 38);

      document.getElementById("back-to-top-btn").onclick = () => {
        sound.playClick();
        clearConfetti();
        resetAllState();
        renderTitle1();
      };
    }

    function spawnConfetti() {
      clearConfetti();
      const colors = ["#facc15", "#38bdf8", "#f43f5e", "#34d399", "#c084fc"];
      for (let i = 0; i < 32; i++) {
        const div = document.createElement("div");
        div.className = "confetti";
        div.style.left = `${Math.random() * 100}vw`;
        div.style.backgroundColor = colors[i % colors.length];
        div.style.animationDuration = `${2.5 + Math.random() * 3}s`;
        div.style.animationDelay = `${Math.random() * 2}s`;
        document.body.appendChild(div);
      }
    }

    function clearConfetti() {
      document.querySelectorAll(".confetti").forEach(el => el.remove());
    }

    /* ==============================================================
       14. 初期起動（DOMContentLoaded で即座に開始）
       ============================================================== */
    document.addEventListener("DOMContentLoaded", () => {
      preloadImagesSafely();
      resetAllState();

      const muteBtn = document.getElementById("mute-toggle-btn");
      const muteIcon = document.getElementById("mute-icon");
      const muteLabel = document.getElementById("mute-label");
      if (muteBtn) {
        muteBtn.onclick = () => {
          const muted = sound.toggleMute();
          muteIcon.className = muted
            ? "fa-solid fa-volume-xmark text-rose-400"
            : "fa-solid fa-volume-high text-amber-300";
          muteLabel.textContent = muted ? "BGM OFF" : "BGM ON";
        };
      }

      renderTitle1();
    });
  </script>
</body>
</html>
